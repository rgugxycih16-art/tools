<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 全局禁止发送来源信息：从本页打开的任何网站都看不到 Referer / document.referrer -->
    <meta name="referrer" content="no-referrer">
    <title>个人专属导航 | Quick Hub</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Google Fonts: Inter & Noto Sans SC -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- 配置 Tailwind 主题 -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans SC', 'sans-serif'],
                    },
                    colors: {
                        darkBg: '#0B0F19',
                        darkCard: '#131A2A',
                        darkBorder: '#1E293B',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 dark:bg-darkBg text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-300 flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- 顶部背景装饰光晕 -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-500/10 dark:bg-indigo-500/20 rounded-full blur-3xl"></div>
        <div class="absolute top-20 right-10 w-80 h-80 bg-cyan-500/10 dark:bg-cyan-500/15 rounded-full blur-3xl"></div>
    </div>

    <!-- 主体内容容器 -->
    <div class="relative z-10 max-w-6xl w-full mx-auto px-4 sm:px-6 lg:px-8 pt-8 pb-16">
        
        <!-- 顶部导航栏：问候语、时间与主题切换 -->
        <header class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-10">
            <div class="text-center sm:text-left">
                <h1 id="greeting" class="text-2xl sm:text-3xl font-bold tracking-tight bg-gradient-to-r from-indigo-500 via-purple-500 to-cyan-500 bg-clip-text text-transparent">
                    欢迎回来
                </h1>
                <p id="datetime" class="text-sm text-slate-500 dark:text-slate-400 mt-1 font-medium">
                    正在加载时间...
                </p>
            </div>

            <div class="flex items-center gap-3">
                <!-- 快捷键提示 -->
                <span class="hidden md:inline-flex items-center px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-200/70 dark:bg-slate-800/80 text-slate-600 dark:text-slate-400 border border-slate-300/50 dark:border-slate-700/50">
                    按 <kbd class="mx-1 px-1.5 py-0.5 bg-white dark:bg-slate-700 rounded shadow-sm text-slate-800 dark:text-slate-200 font-sans">/</kbd> 快速搜索
                </span>

                <!-- 主题切换按钮 -->
                <button id="themeToggle" aria-label="切换深色/浅色模式" class="p-3 rounded-xl bg-white dark:bg-darkCard border border-slate-200 dark:border-darkBorder shadow-sm hover:shadow-md hover:border-indigo-500/50 transition-all duration-200 text-slate-600 dark:text-slate-300">
                    <!-- 太阳图标 (浅色模式显示) -->
                    <svg id="sunIcon" class="w-5 h-5 hidden dark:block text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                    </svg>
                    <!-- 月亮图标 (深色模式显示) -->
                    <svg id="moonIcon" class="w-5 h-5 block dark:hidden text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                    </svg>
                </button>
            </div>
        </header>

        <!-- 搜索区域：支持站内书签过滤与外部引擎直达 -->
        <section class="max-w-2xl mx-auto mb-12">
            <div class="relative group">
                <div class="absolute -inset-0.5 bg-gradient-to-r from-indigo-500 to-cyan-500 rounded-2xl blur opacity-20 group-hover:opacity-40 transition duration-300"></div>
                <div class="relative flex items-center bg-white dark:bg-darkCard rounded-2xl border border-slate-200 dark:border-darkBorder shadow-lg p-1.5">
                    <!-- 搜索引擎切换下拉 -->
                    <select id="searchEngine" aria-label="选择搜索引擎" class="bg-slate-100 dark:bg-slate-800/90 text-slate-700 dark:text-slate-200 text-sm font-medium rounded-xl px-3 py-2.5 outline-none cursor-pointer border-r border-transparent focus:ring-2 focus:ring-indigo-500 transition">
                        <option value="filter">筛选书签</option>
                        <option value="google">Google 搜索</option>
                        <option value="baidu">百度搜索</option>
                        <option value="github">GitHub 搜索</option>
                    </select>

                    <!-- 输入框 -->
                    <input type="text" id="searchInput" placeholder="输入关键词筛选网站，或切换引擎直接搜索..." 
                        class="w-full bg-transparent px-4 py-2.5 text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 outline-none text-sm sm:text-base">

                    <!-- 清除按钮 -->
                    <button id="clearSearch" class="hidden p-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition" title="清除">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>

                    <!-- 搜索/执行按钮 -->
                    <button id="searchBtn" class="ml-1 px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-medium text-sm rounded-xl transition-all duration-150 flex items-center gap-1.5 shrink-0 shadow-sm">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                        <span class="hidden sm:inline">前往</span>
                    </button>
                </div>
            </div>

            <!-- 分类过滤标签 -->
            <div id="categoryTabs" class="flex flex-wrap justify-center gap-2 mt-5">
                <button data-category="all" class="category-btn active px-4 py-1.5 rounded-full text-xs sm:text-sm font-medium bg-indigo-600 text-white shadow-sm transition-all">全部 (8)</button>
                <button data-category="ai" class="category-btn px-4 py-1.5 rounded-full text-xs sm:text-sm font-medium bg-white dark:bg-darkCard text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-darkBorder hover:border-indigo-500/50 transition-all">AI 助手</button>
                <button data-category="cloud" class="category-btn px-4 py-1.5 rounded-full text-xs sm:text-sm font-medium bg-white dark:bg-darkCard text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-darkBorder hover:border-indigo-500/50 transition-all">云与服务器</button>
                <button data-category="dev" class="category-btn px-4 py-1.5 rounded-full text-xs sm:text-sm font-medium bg-white dark:bg-darkCard text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-darkBorder hover:border-indigo-500/50 transition-all">开发与工具</button>
                <button data-category="search" class="category-btn px-4 py-1.5 rounded-full text-xs sm:text-sm font-medium bg-white dark:bg-darkCard text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-darkBorder hover:border-indigo-500/50 transition-all">搜索引擎</button>
            </div>
        </section>

        <!-- 网站卡片网格区域 -->
        <main>
            <div id="sitesGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-5">
                <!-- 卡片内容将由 JavaScript 动态渲染，确保结构清晰且易维护 -->
            </div>

            <!-- 无搜索结果提示 -->
            <div id="emptyState" class="hidden text-center py-16">
                <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-slate-200/70 dark:bg-slate-800 text-slate-400 mb-4">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <h3 class="text-base font-semibold text-slate-700 dark:text-slate-300">未找到匹配的网站</h3>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">尝试更换关键词，或切换上方搜索引擎进行全网搜索</p>
            </div>
        </main>
    </div>

    <!-- 复制成功提示 Toast -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
        <div class="flex items-center gap-2.5 bg-slate-900 dark:bg-slate-800 text-white px-4 py-3 rounded-xl shadow-xl border border-slate-700/70 text-sm font-medium">
            <svg class="w-4 h-4 text-emerald-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            <span id="toastMsg">链接已复制到剪贴板</span>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="relative z-10 text-center py-6 text-xs text-slate-400 dark:text-slate-500 border-t border-slate-200/60 dark:border-slate-800/60">
        <p>个人专属工作台导航 &bull; 点击卡片新标签页打开，点击右上角图标可复制网址</p>
    </footer>

    <!-- 交互逻辑脚本 -->
    <script>
        /**
         * 网站数据配置列表

        const SITES_DATA = [
            {
                id: 'tools',

            },
            {

                iconBg: 'bg-orange-500/10 text-orange-500',
                svg: `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"/></svg>`
            },
            {
                id: 'dmit',
                name: 'DMIT',
                url: 'https://www.dmit.io/clientarea.php',
                domain: 'dmit.io',
                category: 'cloud',
                categoryLabel: 'VPS',
                desc: '高性能云服务器与 CN2 GIA 节点客户中心',
                accent: 'from-sky-500 to-indigo-500',
                iconBg: 'bg-sky-500/10 text-sky-500',
                svg: `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01"/></svg>`
            },
            {
                id: 'github',
                name: 'GitHub',
                url: 'https://github.com/',
                domain: 'github.com',

                accent: 'from-slate-600 to-slate-800',
                iconBg: 'bg-slate-500/15 text-slate-700 dark:text-slate-200',
                svg: `<svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>`

            {

            {

                iconBg: 'bg-amber-600/10 text-amber-600 dark:text-amber-500',
                svg: `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>`
            },
            {

                url: 'http://www.google.com/ncr',
                domain: 'google.com/ncr',
                category: 'search',
                categoryLabel: '搜索引擎',
                desc: '全球信息检索 (No Country Redirect 国际版)',
                accent: 'from-blue-500 via-red-500 to-yellow-500',
                iconBg: 'bg-blue-500/10 text-blue-500',
                svg: `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"/></svg>`
            },
            {
                id: 'baidu',
                name: '百度一下',
                url: 'https://www.baidu.com/',
                domain: 'baidu.com',
                category: 'search',
                categoryLabel: '搜索引擎',
                desc: '中文互联网资讯、百科与本地资源搜索',
                accent: 'from-blue-600 to-indigo-600',
                iconBg: 'bg-indigo-500/10 text-indigo-500',
                svg: `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>`
            }
        ];

        // 状态管理
        let currentCategory = 'all';
        let searchQuery = '';

        // DOM 元素引用
        const sitesGrid = document.getElementById('sitesGrid');
        const emptyState = document.getElementById('emptyState');
        const searchInput = document.getElementById('searchInput');
        const searchEngine = document.getElementById('searchEngine');
        const searchBtn = document.getElementById('searchBtn');
        const clearSearch = document.getElementById('clearSearch');
        const categoryBtns = document.querySelectorAll('.category-btn');
        const themeToggle = document.getElementById('themeToggle');

        /**
         * 渲染网站卡片网格
         */
        function renderCards() {
            try {
                const filtered = SITES_DATA.filter(site => {
                    const matchCat = currentCategory === 'all' || site.category === currentCategory;
                    const q = searchQuery.toLowerCase().trim();
                    const matchText = !q || 
                        site.name.toLowerCase().includes(q) || 
                        site.desc.toLowerCase().includes(q) || 
                        site.domain.toLowerCase().includes(q) ||
                        site.categoryLabel.toLowerCase().includes(q);
                    return matchCat && matchText;
                });

                if (filtered.length === 0) {
                    sitesGrid.innerHTML = '';
                    emptyState.classList.remove('hidden');
                    return;
                }

                emptyState.classList.add('hidden');
                sitesGrid.innerHTML = filtered.map(site => `
                    <div class="group relative bg-white dark:bg-darkCard rounded-2xl border border-slate-200/80 dark:border-darkBorder p-5 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300 flex flex-col justify-between overflow-hidden">
                        <!-- 顶部悬停彩条 -->
                        <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r ${site.accent} opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                        
                        <div>
                            <!-- 头部：图标 + 复制链接按钮 -->
                            <div class="flex items-start justify-between gap-3 mb-4">
                                <a href="${site.url}" target="_blank" rel="noopener noreferrer" class="w-12 h-12 rounded-xl ${site.iconBg} flex items-center justify-center shrink-0 group-hover:scale-105 transition-transform duration-200">
                                    ${site.svg}
                                </a>
                                
                                <div class="flex items-center gap-1.5">
                                    <span class="px-2.5 py-1 rounded-lg text-[11px] font-medium bg-slate-100 dark:bg-slate-800/80 text-slate-500 dark:text-slate-400">
                                        ${site.categoryLabel}
                                    </span>
                                    <button onclick="copyUrl('${site.url}', '${site.name}')" title="复制网址" class="p-2 rounded-lg text-slate-400 hover:text-indigo-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                                    </button>
                                </div>
                            </div>

                            <!-- 标题与描述 (整块可点击跳转) -->
                            <a href="${site.url}" target="_blank" rel="noopener noreferrer" class="block focus:outline-none">
                                <div class="flex items-center gap-1.5">
                                    <h2 class="text-lg font-bold text-slate-800 dark:text-slate-100 group-hover:text-indigo-500 dark:group-hover:text-indigo-400 transition-colors">
                                        ${site.name}
                                    </h2>
                                    <svg class="w-4 h-4 text-slate-400 opacity-0 -translate-x-1 group-hover:opacity-100 group-hover:translate-x-0 transition-all duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                                    </svg>
                                </div>
                                <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-1.5 line-clamp-2 leading-relaxed">
                                    ${site.desc}
                                </p>
                            </a>
                        </div>

                        <!-- 底部域名展示 -->
                        <a href="${site.url}" target="_blank" rel="noopener noreferrer" class="mt-4 pt-3 border-t border-slate-100 dark:border-slate-800/80 flex items-center justify-between text-xs text-slate-400 dark:text-slate-500 group-hover:text-slate-600 dark:group-hover:text-slate-300 transition-colors">
                            <span class="truncate font-mono">${site.domain}</span>
                            <span class="font-medium text-indigo-500 opacity-0 group-hover:opacity-100 transition-opacity">访问 &rarr;</span>
                        </a>
                    </div>
                `).join('');
            } catch (err) {
                console.error('渲染卡片时出错:', err);
            }
        }

        /**
         * 复制网址到剪贴板并显示 Toast 提示 (兼容 iframe 环境)
         */
        function copyUrl(url, name) {
            try {
                const tempInput = document.createElement('textarea');
                tempInput.value = url;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand('copy');
                document.body.removeChild(tempInput);
                showToast(`已复制 ${name} 的网址`);
            } catch (err) {
                showToast('复制失败，请手动复制');
            }
        }

        /**
         * 显示底部通知气泡
         */
        let toastTimer = null;
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.textContent = message;
            
            toast.classList.remove('translate-y-20', 'opacity-0');
            
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        /**
         * 执行搜索或跳转逻辑
         */
        function handleSearchAction() {
            const engine = searchEngine.value;
            const query = searchInput.value.trim();

            if (engine === 'filter') {
                searchQuery = query;
                renderCards();
                return;
            }

            if (!query) {
                searchInput.focus();
                return;
            }

            let targetUrl = '';
            const encoded = encodeURIComponent(query);
            if (engine === 'google') {
                targetUrl = `https://www.google.com/search?q=${encoded}`;
            } else if (engine === 'baidu') {
                targetUrl = `https://www.baidu.com/s?wd=${encoded}`;
            } else if (engine === 'github') {
                targetUrl = `https://github.com/search?q=${encoded}`;
            }

            if (targetUrl) {
                window.open(targetUrl, '_blank', 'noopener,noreferrer');
            }
        }

        /**
         * 更新实时时间与动态问候语
         */
        function updateClock() {
            const now = new Date();
            const hours = now.getHours();
            let greetingText = '你好，祝你今天愉快';
            if (hours < 6) greetingText = '夜深了，注意休息';
            else if (hours < 12) greetingText = '早上好，开启高效的一天';
            else if (hours < 14) greetingText = '中午好，记得适当小憩';
            else if (hours < 18) greetingText = '下午好，继续保持专注';
            else greetingText = '晚上好，享受属于你的时间';

            document.getElementById('greeting').textContent = greetingText;

            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long', hour: '2-digit', minute: '2-digit', second: '2-digit' };
            document.getElementById('datetime').textContent = now.toLocaleDateString('zh-CN', options);
        }

        /**
         * 初始化事件监听
         */
        function init() {
            // 渲染初始卡片
            renderCards();
            updateClock();
            setInterval(updateClock, 1000);

            // 输入框实时响应
            searchInput.addEventListener('input', (e) => {
                const val = e.target.value;
                clearSearch.classList.toggle('hidden', val.length === 0);
                if (searchEngine.value === 'filter') {
                    searchQuery = val;
                    renderCards();
                }
            });

            // 回车触发搜索
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    handleSearchAction();
                }
            });

            // 点击搜索按钮
            searchBtn.addEventListener('click', handleSearchAction);

            // 切换搜索引擎时的交互优化
            searchEngine.addEventListener('change', () => {
                if (searchEngine.value === 'filter') {
                    searchInput.placeholder = '输入关键词筛选网站...';
                    searchQuery = searchInput.value;
                } else {
                    const engineName = searchEngine.options[searchEngine.selectedIndex].text;
                    searchInput.placeholder = `在 ${engineName} 中输入内容并按回车...`;
                    searchQuery = ''; // 外部搜索时恢复展示全部书签
                }
                renderCards();
                searchInput.focus();
            });

            // 清除输入按钮
            clearSearch.addEventListener('click', () => {
                searchInput.value = '';
                searchQuery = '';
                clearSearch.classList.add('hidden');
                renderCards();
                searchInput.focus();
            });

            // 分类筛选按钮
            categoryBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    categoryBtns.forEach(b => {
                        b.classList.remove('bg-indigo-600', 'text-white', 'shadow-sm');
                        b.classList.add('bg-white', 'dark:bg-darkCard', 'text-slate-600', 'dark:text-slate-300', 'border', 'border-slate-200', 'dark:border-darkBorder');
                    });
                    btn.classList.remove('bg-white', 'dark:bg-darkCard', 'text-slate-600', 'dark:text-slate-300', 'border', 'border-slate-200', 'dark:border-darkBorder');
                    btn.classList.add('bg-indigo-600', 'text-white', 'shadow-sm');

                    currentCategory = btn.dataset.category;
                    renderCards();
                });
            });

            // 深色/浅色主题切换
            themeToggle.addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
                const isDark = document.documentElement.classList.contains('dark');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            });

            // 读取本地主题偏好
            if (localStorage.getItem('theme') === 'light') {
                document.documentElement.classList.remove('dark');
            }

            // 全局快捷键 '/' 聚焦搜索框
            document.addEventListener('keydown', (e) => {
                if (e.key === '/' && document.activeElement !== searchInput) {
                    e.preventDefault();
                    searchInput.focus();
                }
            });
        }

        // 页面加载完成后启动
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
