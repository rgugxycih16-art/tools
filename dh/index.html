        function loadOrderedSites() {

                const savedOrder = JSON.parse(localStorage.getItem('quickhub_site_order'));
                if (Array.isArray(savedOrder) && savedOrder.length > 0) {
                    const siteMap = new Map(DEFAULT_SITES.map(s => [s.id, s]));
                    const ordered = [];
                    savedOrder.forEach(id => {
                        if (siteMap.has(id)) {
                            ordered.push(siteMap.get(id));
                            siteMap.delete(id);
                        }
                    });
                    // 把新增的默认站点追加到末尾
                    siteMap.forEach(site => ordered.push(site));
                    return ordered;
                }
            } catch (e) {
                console.warn('读取排序缓存失败:', e);
            }
            return [...DEFAULT_SITES];
        }

        let isSortMode = false;
        let draggedId = null;

        // DOM 元素引用
        const sitesGrid = document.getElementById('sitesGrid');
        const emptyState = document.getElementById('emptyState');
        const searchInput = document.getElementById('searchInput');
        const searchEngine = document.getElementById('searchEngine');
        const searchBtn = document.getElementById('searchBtn');
        const clearSearch = document.getElementById('clearSearch');
        const categoryBtns = document.querySelectorAll('.category-btn');
        const themeToggle = document.getElementById('themeToggle');
        const sortToggleBtn = document.getElementById('sortToggleBtn');
        const sortBtnText = document.getElementById('sortBtnText');
        const resetOrderBtn = document.getElementById('resetOrderBtn');
        const sortBanner = document.getElementById('sortBanner');

        /**
         * 保存当前顺序到本地存储
         */
        function saveOrder() {
            const ids = sitesList.map(s => s.id);
            localStorage.setItem('quickhub_site_order', JSON.stringify(ids));
        }

        /**
         * 移动卡片位置 (支持手机端左右按钮及拖拽)
         */
        function moveSite(id, direction) {
            const index = sitesList.findIndex(s => s.id === id);
            if (index === -1) return;
            const targetIndex = index + direction;
            if (targetIndex < 0 || targetIndex >= sitesList.length) return;

            const temp = sitesList[index];
            sitesList[index] = sitesList[targetIndex];
            sitesList[targetIndex] = temp;

            saveOrder();
            renderCards();
        }

        /**
         * 切换排序模式
         */
        function toggleSortMode() {
            isSortMode = !isSortMode;
            if (isSortMode) {
                // 排序模式下自动切回全部并清空筛选，避免部分隐藏导致顺序混乱
                currentCategory = 'all';
                searchQuery = '';
                searchInput.value = '';
                clearSearch.classList.add('hidden');
                updateCategoryButtonsUI('all');

                sortBtnText.textContent = '完成排序';
                sortToggleBtn.classList.add('ring-2', 'ring-indigo-500', 'bg-indigo-50', 'dark:bg-indigo-950/50');
                resetOrderBtn.classList.remove('hidden');
                sortBanner.classList.remove('hidden');
            } else {
                sortBtnText.textContent = '调整顺序';
                sortToggleBtn.classList.remove('ring-2', 'ring-indigo-500', 'bg-indigo-50', 'dark:bg-indigo-950/50');
                resetOrderBtn.classList.add('hidden');
                sortBanner.classList.add('hidden');
                showToast('卡片顺序已保存');
            }
            renderCards();
        }

        /**
         * 重置为默认顺序
         */
        function resetSiteOrder() {
            sitesList = [...DEFAULT_SITES];
            localStorage.removeItem('quickhub_site_order');
            renderCards();
            showToast('已恢复默认排序');
        }

        /**
         * 渲染网站卡片网格
         */
        function renderCards() {
            try {
                const filtered = sitesList.filter(site => {
                    const matchCat = currentCategory === 'all' || site.category === currentCategory;
                    const q = searchQuery.toLowerCase().trim();
                    const matchText = !q || 
                        site.name.toLowerCase().includes(q) || 
                        site.desc.toLowerCase().includes(q) || 
                        site.domain.toLowerCase().includes(q) ||
                        site.categoryLabel.toLowerCase().includes(q);
                    return matchCat && matchText;
                });

                if (filtered.length === 0) {
                    sitesGrid.innerHTML = '';
                    emptyState.classList.remove('hidden');
                    return;
                }

                emptyState.classList.add('hidden');
                sitesGrid.innerHTML = filtered.map((site, idx) => {
                    const isFirst = idx === 0;
                    const isLast = idx === filtered.length - 1;

                    return `
                    <div 
                        data-id="${site.id}"
                        draggable="${isSortMode}"
                        ondragstart="handleDragStart(event, '${site.id}')"
                        ondragover="handleDragOver(event)"
                        ondrop="handleDrop(event, '${site.id}')"
                        ondragend="handleDragEnd(event)"
                        class="site-card group relative bg-white dark:bg-darkCard rounded-2xl border ${isSortMode ? 'border-dashed border-indigo-400 dark:border-indigo-500/70 cursor-move' : 'border-slate-200/80 dark:border-darkBorder hover:-translate-y-1'} p-3.5 sm:p-5 shadow-sm hover:shadow-xl transition-all duration-300 flex flex-col justify-between overflow-hidden select-none">
                        
                        <!-- 顶部悬停彩条 -->
                        <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r ${site.accent} ${isSortMode ? 'opacity-100' : 'opacity-0 group-hover:opacity-100'} transition-opacity duration-300"></div>
                        
                        <div>
                            <!-- 头部：图标 + 右上角操作区 -->
                            <div class="flex items-start justify-between gap-2 mb-3 sm:mb-4">
                                <a href="${isSortMode ? 'javascript:void(0)' : site.url}" ${isSortMode ? '' : 'target="_blank" rel="noopener noreferrer"'} class="w-10 h-10 sm:w-12 sm:h-12 rounded-xl ${site.iconBg} flex items-center justify-center shrink-0 group-hover:scale-105 transition-transform duration-200">
                                    ${site.svg}
                                </a>
                                
                                ${isSortMode ? `
                                <!-- 排序控制按钮 (iPhone 单手点按极度友好) -->
                                <div class="flex items-center gap-1 bg-slate-100 dark:bg-slate-800 p-1 rounded-xl">
                                    <button onclick="moveSite('${site.id}', -1)" ${isFirst ? 'disabled' : ''} title="向前移动" class="p-1.5 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-white dark:hover:bg-slate-700 disabled:opacity-30 transition">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                                    </button>
                                    <button onclick="moveSite('${site.id}', 1)" ${isLast ? 'disabled' : ''} title="向后移动" class="p-1.5 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-white dark:hover:bg-slate-700 disabled:opacity-30 transition">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                                    </button>
                                </div>
                                ` : `
                                <div class="flex items-center gap-1">
                                    <span class="hidden sm:inline-block px-2 py-0.5 rounded-lg text-[11px] font-medium bg-slate-100 dark:bg-slate-800/80 text-slate-500 dark:text-slate-400">
                                        ${site.categoryLabel}
                                    </span>
                                    <button onclick="copyUrl('${site.url}', '${site.name}')" title="复制网址" class="p-1.5 sm:p-2 rounded-lg text-slate-400 hover:text-indigo-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                                    </button>
                                </div>
                                `}
                            </div>

                            <!-- 标题与描述 -->
                            <a href="${isSortMode ? 'javascript:void(0)' : site.url}" ${isSortMode ? '' : 'target="_blank" rel="noopener noreferrer"'} class="block focus:outline-none">
                                <div class="flex items-center gap-1">
                                    <h2 class="text-sm sm:text-lg font-bold text-slate-800 dark:text-slate-100 group-hover:text-indigo-500 dark:group-hover:text-indigo-400 transition-colors truncate">
                                        ${site.name}
                                    </h2>
                                    <svg class="hidden sm:block w-4 h-4 text-slate-400 opacity-0 -translate-x-1 group-hover:opacity-100 group-hover:translate-x-0 transition-all duration-200 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                                    </svg>
                                </div>
                                <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-1 line-clamp-2 leading-relaxed">
                                    ${site.desc}
                                </p>
                            </a>
                        </div>

                        <!-- 底部域名展示 -->
                        <a href="${isSortMode ? 'javascript:void(0)' : site.url}" ${isSortMode ? '' : 'target="_blank" rel="noopener noreferrer"'} class="mt-3 sm:mt-4 pt-2.5 sm:pt-3 border-t border-slate-100 dark:border-slate-800/80 flex items-center justify-between text-[11px] sm:text-xs text-slate-400 dark:text-slate-500 group-hover:text-slate-600 dark:group-hover:text-slate-300 transition-colors">
                            <span class="truncate font-mono">${site.domain}</span>
                            <span class="hidden sm:inline font-medium text-indigo-500 opacity-0 group-hover:opacity-100 transition-opacity shrink-0 ml-1">访问 &rarr;</span>
                        </a>
                    </div>
                `}).join('');
            } catch (err) {
                console.error('渲染卡片时出错:', err);
            }
        }

        /**
         * HTML5 拖拽排序事件处理
         */
        function handleDragStart(e, id) {
            if (!isSortMode) return;
            draggedId = id;
            e.dataTransfer.effectAllowed = 'move';
            e.currentTarget.classList.add('opacity-50', 'scale-95');
        }

        function handleDragOver(e) {
            if (!isSortMode) return;
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        }

        function handleDrop(e, targetId) {
            if (!isSortMode) return;
            e.preventDefault();
            if (!draggedId || draggedId === targetId) return;

            const fromIdx = sitesList.findIndex(s => s.id === draggedId);
            const toIdx = sitesList.findIndex(s => s.id === targetId);
            if (fromIdx !== -1 && toIdx !== -1) {
                const [movedItem] = sitesList.splice(fromIdx, 1);
                sitesList.splice(toIdx, 0, movedItem);
                saveOrder();
                renderCards();
            }
        }

        function handleDragEnd(e) {
            e.currentTarget.classList.remove('opacity-50', 'scale-95');
            draggedId = null;
        }

        /**
         * 复制网址到剪贴板并显示 Toast 提示
         */
        function copyUrl(url, name) {
            try {
                const tempInput = document.createElement('textarea');
                tempInput.value = url;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand('copy');
                document.body.removeChild(tempInput);
                showToast(`已复制 ${name} 的网址`);
            } catch (err) {
                showToast('复制失败，请手动复制');
            }
        }

        /**
         * 显示底部通知气泡
         */
        let toastTimer = null;
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.textContent = message;
            
            toast.classList.remove('translate-y-20', 'opacity-0');
            
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        /**
         * 执行搜索或跳转逻辑
         */
        function handleSearchAction() {
            const engine = searchEngine.value;
            const query = searchInput.value.trim();

            if (engine === 'filter') {
                searchQuery = query;
                renderCards();
                return;
            }

            if (!query) {
                searchInput.focus();
                return;
            }

            let targetUrl = '';
            const encoded = encodeURIComponent(query);
            if (engine === 'google') {
                targetUrl = `https://www.google.com/search?q=${encoded}`;
            } else if (engine === 'baidu') {
                targetUrl = `https://www.baidu.com/s?wd=${encoded}`;
            } else if (engine === 'github') {
                targetUrl = `https://github.com/search?q=${encoded}`;
            }

            if (targetUrl) {
                window.open(targetUrl, '_blank', 'noopener,noreferrer');
            }
        }

        /**
         * 更新分类标签高亮样式
         */
        function updateCategoryButtonsUI(activeCat) {
            categoryBtns.forEach(b => {
                if (b.dataset.category === activeCat) {
                    b.classList.remove('bg-white', 'dark:bg-darkCard', 'text-slate-600', 'dark:text-slate-300', 'border', 'border-slate-200', 'dark:border-darkBorder');
                    b.classList.add('bg-indigo-600', 'text-white', 'shadow-sm');
                } else {
                    b.classList.remove('bg-indigo-600', 'text-white', 'shadow-sm');
                    b.classList.add('bg-white', 'dark:bg-darkCard', 'text-slate-600', 'dark:text-slate-300', 'border', 'border-slate-200', 'dark:border-darkBorder');
                }
            });
        }

        /**
         * 更新实时时间与动态问候语
         */
        function updateClock() {
            const now = new Date();
            const hours = now.getHours();
            let greetingText = '你好，祝你今天愉快';
            if (hours < 6) greetingText = '夜深了，注意休息';
            else if (hours < 12) greetingText = '早上好，开启高效的一天';
            else if (hours < 14) greetingText = '中午好，记得适当小憩';
            else if (hours < 18) greetingText = '下午好，继续保持专注';
            else greetingText = '晚上好，享受属于你的时间';

            document.getElementById('greeting').textContent = greetingText;

            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long', hour: '2-digit', minute: '2-digit', second: '2-digit' };
            document.getElementById('datetime').textContent = now.toLocaleDateString('zh-CN', options);
        }

        /**
         * 初始化事件监听
         */
        function init() {
            renderCards();
            updateClock();
            setInterval(updateClock, 1000);

            // 排序按钮监听
            sortToggleBtn.addEventListener('click', toggleSortMode);
            resetOrderBtn.addEventListener('click', resetSiteOrder);

            // 输入框实时响应
            searchInput.addEventListener('input', (e) => {
                const val = e.target.value;
                clearSearch.classList.toggle('hidden', val.length === 0);
                if (searchEngine.value === 'filter') {
                    searchQuery = val;
                    renderCards();
                }
            });

            // 回车触发搜索
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    handleSearchAction();
                }
            });

            // 点击搜索按钮
            searchBtn.addEventListener('click', handleSearchAction);

            // 切换搜索引擎时的交互优化
            searchEngine.addEventListener('change', () => {
                if (searchEngine.value === 'filter') {
                    searchInput.placeholder = '输入关键词筛选网站...';
                    searchQuery = searchInput.value;
                } else {
                    const engineName = searchEngine.options[searchEngine.selectedIndex].text;
                    searchInput.placeholder = `在 ${engineName} 中输入内容并按回车...`;
                    searchQuery = '';
                }
                renderCards();
                searchInput.focus();
            });

            // 清除输入按钮
            clearSearch.addEventListener('click', () => {
                searchInput.value = '';
                searchQuery = '';
                clearSearch.classList.add('hidden');
                renderCards();
                searchInput.focus();
            });

            // 分类筛选按钮
            categoryBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    if (isSortMode) {
                        toggleSortMode();
                    }
                    currentCategory = btn.dataset.category;
                    updateCategoryButtonsUI(currentCategory);
                    renderCards();
                });
            });

            // 深色/浅色主题切换
            themeToggle.addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
                const isDark = document.documentElement.classList.contains('dark');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            });

            // 读取本地主题偏好
            if (localStorage.getItem('theme') === 'light') {
                document.documentElement.classList.remove('dark');
            }

            // 全局快捷键 '/' 聚焦搜索框
            document.addEventListener('keydown', (e) => {
                if (e.key === '/' && document.activeElement !== searchInput) {
                    e.preventDefault();
                    searchInput.focus();
                }
            });
        }

        // 页面加载完成后启动
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
