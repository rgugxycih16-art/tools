                svg: `<svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"/></svg>`
            },
            {
                id: 'baidu',
                name: '百度一下',
                url: 'https://www.baidu.com/',
                domain: 'baidu.com',
                category: 'search',
                categoryLabel: '搜索引擎',
                desc: '中文互联网资讯、百科与本地资源搜索',
                accent: 'from-blue-600 to-indigo-600',
                iconBg: 'bg-indigo-500/10 text-indigo-500',
                svg: `<svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>`
            }
        ];

        /**
         * 分类与颜色预设 (自定义网站使用；颜色类名需写全，Tailwind 才会编译进样式)
         */
        const CATEGORY_LABELS = { ai: 'AI 助手', cloud: '云与服务器', dev: '开发与工具', search: '搜索引擎' };
        const COLOR_PRESETS = {
            indigo:  { dot: 'bg-indigo-500',  accent: 'from-indigo-500 to-purple-500',   iconBg: 'bg-indigo-500/10 text-indigo-500' },
            blue:    { dot: 'bg-blue-500',    accent: 'from-blue-500 to-cyan-500',       iconBg: 'bg-blue-500/10 text-blue-500' },
            emerald: { dot: 'bg-emerald-500', accent: 'from-emerald-500 to-teal-500',    iconBg: 'bg-emerald-500/10 text-emerald-500' },
            amber:   { dot: 'bg-amber-500',   accent: 'from-amber-500 to-orange-500',    iconBg: 'bg-amber-500/10 text-amber-600 dark:text-amber-500' },
            rose:    { dot: 'bg-rose-500',    accent: 'from-rose-500 to-pink-500',       iconBg: 'bg-rose-500/10 text-rose-500' },
            violet:  { dot: 'bg-violet-500',  accent: 'from-violet-500 to-fuchsia-500',  iconBg: 'bg-violet-500/10 text-violet-500' },
            slate:   { dot: 'bg-slate-500',   accent: 'from-slate-500 to-slate-700',     iconBg: 'bg-slate-500/15 text-slate-700 dark:text-slate-200' },
        };

        const STORE = { order: 'quickhub_site_order', custom: 'quickhub_custom_sites', hidden: 'quickhub_hidden_sites' };

        function readJSON(key, fallback) {
            try {
                const v = JSON.parse(localStorage.getItem(key));
                return v ?? fallback;
            } catch (e) {
                return fallback;
            }
        }
        function writeJSON(key, value) {
            try {
                localStorage.setItem(key, JSON.stringify(value));
            } catch (e) {
                console.warn('保存失败:', key, e);
                showToast('保存失败：浏览器可能禁用了本地存储');
            }
        }

        // 转义用户输入，防止名称里的引号、尖括号破坏页面
        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        // 把保存的自定义网站数据补全成可渲染的卡片对象 (图标用名称首字，不请求外部 favicon)
        function hydrateCustomSite(raw) {
            const preset = COLOR_PRESETS[raw.color] || COLOR_PRESETS.indigo;
            const letter = (Array.from(raw.name.trim())[0] || '?').toUpperCase();
            return {
                ...raw,
                custom: true,
                categoryLabel: CATEGORY_LABELS[raw.category] || '自定义',
                accent: preset.accent,
                iconBg: preset.iconBg,
                svg: `<span class="text-base sm:text-xl font-bold leading-none">${escapeHtml(letter)}</span>`
            };
        }

        let customSites = readJSON(STORE.custom, []).filter(s => s && s.id && s.name && s.url);
        let hiddenIds = new Set(readJSON(STORE.hidden, []));

        // 合并内置与自定义网站，再按保存的顺序排列
        function loadOrderedSites() {
            const all = [
                ...DEFAULT_SITES.filter(s => !hiddenIds.has(s.id)),
                ...customSites.map(hydrateCustomSite)
            ];
            const savedOrder = readJSON(STORE.order, []);
            if (!Array.isArray(savedOrder) || savedOrder.length === 0) return all;

            const siteMap = new Map(all.map(s => [s.id, s]));
            const ordered = [];
            savedOrder.forEach(id => {
                if (siteMap.has(id)) {
                    ordered.push(siteMap.get(id));
                    siteMap.delete(id);
                }
            });
            // 不在保存顺序里的 (新加入的) 追加到末尾
            siteMap.forEach(site => ordered.push(site));
            return ordered;
        }

        // 状态管理
        let sitesList = loadOrderedSites();
        let currentCategory = 'all';
        let searchQuery = '';
        let isSortMode = false;
        let draggedId = null;

        // DOM 元素引用
        const sitesGrid = document.getElementById('sitesGrid');
        const emptyState = document.getElementById('emptyState');
        const searchInput = document.getElementById('searchInput');
        const searchEngine = document.getElementById('searchEngine');
        const searchBtn = document.getElementById('searchBtn');
        const clearSearch = document.getElementById('clearSearch');
        const categoryBtns = document.querySelectorAll('.category-btn');
        const themeToggle = document.getElementById('themeToggle');
        const sortToggleBtn = document.getElementById('sortToggleBtn');
        const sortBtnText = document.getElementById('sortBtnText');
        const resetOrderBtn = document.getElementById('resetOrderBtn');
        const sortBanner = document.getElementById('sortBanner');
        const addSiteBtn = document.getElementById('addSiteBtn');
        const addModal = document.getElementById('addModal');
        const addForm = document.getElementById('addForm');
        const addName = document.getElementById('addName');
        const addUrl = document.getElementById('addUrl');
        const addCategory = document.getElementById('addCategory');
        const addDesc = document.getElementById('addDesc');
        const addError = document.getElementById('addError');
        const colorPicker = document.getElementById('colorPicker');

        /**
         * 保存当前顺序到本地存储
         */
        function saveOrder() {
            writeJSON(STORE.order, sitesList.map(s => s.id));
        }

        /**
         * 移动卡片位置 (支持手机端左右按钮及拖拽)
         */
        function moveSite(id, direction) {
            const index = sitesList.findIndex(s => s.id === id);
            if (index === -1) return;
            const targetIndex = index + direction;
            if (targetIndex < 0 || targetIndex >= sitesList.length) return;

            const temp = sitesList[index];
            sitesList[index] = sitesList[targetIndex];
            sitesList[targetIndex] = temp;

            saveOrder();
            renderCards();
        }

        /**
         * 切换排序模式
         */
        function toggleSortMode() {
            isSortMode = !isSortMode;
            if (isSortMode) {
                // 排序模式下自动切回全部并清空筛选，避免部分隐藏导致顺序混乱
                currentCategory = 'all';
                searchQuery = '';
                searchInput.value = '';
                clearSearch.classList.add('hidden');
                updateCategoryButtonsUI('all');

                sortBtnText.textContent = '完成排序';
                sortToggleBtn.classList.remove('bg-white', 'dark:bg-darkCard');
                sortToggleBtn.classList.add('ring-2', 'ring-indigo-500', 'bg-indigo-50', 'dark:bg-indigo-950/50');
                resetOrderBtn.classList.remove('hidden');
                sortBanner.classList.remove('hidden');
            } else {
                sortBtnText.textContent = '调整顺序';
                sortToggleBtn.classList.remove('ring-2', 'ring-indigo-500', 'bg-indigo-50', 'dark:bg-indigo-950/50');
                sortToggleBtn.classList.add('bg-white', 'dark:bg-darkCard');
                resetOrderBtn.classList.add('hidden');
                sortBanner.classList.add('hidden');
                showToast('卡片顺序已保存');
            }
            setSearchLocked(isSortMode);
            renderCards();
        }

        /**
         * 排序模式下锁定搜索区，避免筛选后与隐藏卡片交换位置
         */
        let savedPlaceholder = '';
        function setSearchLocked(locked) {
            searchInput.disabled = locked;
            searchEngine.disabled = locked;
            searchBtn.disabled = locked;
            if (locked) {
                savedPlaceholder = searchInput.placeholder;
                searchInput.placeholder = '排序中，完成后可搜索';
                searchInput.blur();
            } else if (savedPlaceholder) {
                searchInput.placeholder = savedPlaceholder;
            }
        }

        /**
         * 重置：恢复默认顺序，并找回被删除的内置网站 (自己添加的网站保留，排在最后)
         */
        function resetSiteOrder() {
            try {
                localStorage.removeItem(STORE.order);
                localStorage.removeItem(STORE.hidden);
            } catch (e) {}
            hiddenIds = new Set();
            sitesList = loadOrderedSites();
            updateAllCount();
            renderCards();
            showToast('已恢复默认顺序和内置网站');
        }

        /**
         * 删除网站：自定义网站直接删除；内置网站改为隐藏，可用「重置」找回
         */
        function deleteSite(id) {
            const site = sitesList.find(s => s.id === id);
            if (!site) return;
            const tip = site.custom ? '' : '\n(内置网站，之后可点「重置」恢复)';
            if (!confirm(`确定删除「${site.name}」吗？${tip}`)) return;

            if (site.custom) {
                customSites = customSites.filter(s => s.id !== id);
                writeJSON(STORE.custom, customSites);
            } else {
                hiddenIds.add(id);
                writeJSON(STORE.hidden, [...hiddenIds]);
            }
            sitesList = sitesList.filter(s => s.id !== id);
            saveOrder();
            updateAllCount();
            renderCards();
            showToast(`已删除 ${site.name}`);
        }

        /**
         * 更新「全部 (n)」计数
         */
        function updateAllCount() {
            const allBtn = document.querySelector('.category-btn[data-category="all"]');
            if (allBtn) allBtn.textContent = `全部 (${sitesList.length})`;
        }

        /**
         * 添加网站弹窗
         */
        let selectedColor = 'indigo';

        function renderColorPicker() {
            colorPicker.innerHTML = Object.entries(COLOR_PRESETS).map(([key, p]) => `
                <label class="cursor-pointer">
                    <input type="radio" name="addColor" value="${key}" ${key === selectedColor ? 'checked' : ''} class="peer sr-only">
                    <span class="block w-8 h-8 rounded-full ${p.dot} ring-offset-2 ring-offset-white dark:ring-offset-darkCard peer-checked:ring-2 peer-checked:ring-slate-500 dark:peer-checked:ring-slate-200 peer-focus-visible:ring-2 peer-focus-visible:ring-indigo-500 transition"></span>
                </label>
            `).join('');
        }

        function showAddError(msg) {
            addError.textContent = msg;
            addError.classList.toggle('hidden', !msg);
        }

        function openAddModal() {
            addForm.reset();
            showAddError('');
            selectedColor = 'indigo';
            addCategory.innerHTML = Object.entries(CATEGORY_LABELS)
                .map(([k, label]) => `<option value="${k}">${label}</option>`).join('');
            // 当前正在看某个分类时，默认选中它
            if (CATEGORY_LABELS[currentCategory]) addCategory.value = currentCategory;
            renderColorPicker();
            addModal.classList.remove('hidden');
            document.body.classList.add('overflow-hidden');
            setTimeout(() => addName.focus(), 50);
        }

        function closeAddModal() {
            addModal.classList.add('hidden');
            document.body.classList.remove('overflow-hidden');
        }

        // 规范化网址：自动补 https://，只允许 http/https
        function normalizeUrl(raw) {
            let str = raw.trim();
            if (!str) return null;
            if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(str)) str = 'https://' + str;
            try {
                const u = new URL(str);
                if (u.protocol !== 'http:' && u.protocol !== 'https:') return null;
                if (!u.hostname.includes('.') && u.hostname !== 'localhost') return null;
                return u;
            } catch (e) {
                return null;
            }
        }

        // 用于判断重复：忽略 http/https、www. 和末尾斜杠
        function urlKey(href) {
            try {
                const u = new URL(href);
                return u.hostname.replace(/^www\./, '') + u.pathname.replace(/\/+$/, '') + u.search;
            } catch (e) {
                return href;
            }
        }

        function submitAddSite(e) {
            e.preventDefault();
            const name = addName.value.trim();
            const u = normalizeUrl(addUrl.value);
            if (!name) { showAddError('请填写名称'); addName.focus(); return; }
            if (!u) { showAddError('网址格式不对，例如：notion.so 或 https://www.notion.so'); addUrl.focus(); return; }
            if (sitesList.some(s => urlKey(s.url) === urlKey(u.href))) { showAddError('这个网址已经在列表里了'); addUrl.focus(); return; }

            const path = u.pathname === '/' ? '' : u.pathname.replace(/\/$/, '');
            const raw = {
                id: 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
                name,
                url: u.href,
                domain: u.hostname.replace(/^www\./, '') + path,
                category: addCategory.value,
                desc: addDesc.value.trim() || '自定义添加的网站',
                color: (colorPicker.querySelector('input[name="addColor"]:checked') || {}).value || 'indigo'
            };

            customSites.push(raw);
            writeJSON(STORE.custom, customSites);
            sitesList.push(hydrateCustomSite(raw));
            saveOrder();
            updateAllCount();
            closeAddModal();

            // 确保新卡片可见：清空筛选、切回全部
            if (!isSortMode) {
                searchQuery = '';
                searchInput.value = '';
                clearSearch.classList.add('hidden');
            }
            currentCategory = 'all';
            updateCategoryButtonsUI('all');
            renderCards();
            showToast(`已添加 ${name}`);

            const card = sitesGrid.querySelector(`[data-id="${raw.id}"]`);
            if (card) {
                card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                card.classList.add('ring-2', 'ring-indigo-500');
                setTimeout(() => card.classList.remove('ring-2', 'ring-indigo-500'), 1800);
            }
        }

        /**
         * 渲染网站卡片网格
         */
        function renderCards() {
            try {
                const filtered = sitesList.filter(site => {
                    const matchCat = currentCategory === 'all' || site.category === currentCategory;
                    const q = searchQuery.toLowerCase().trim();
                    const matchText = !q || 
                        site.name.toLowerCase().includes(q) || 
                        site.desc.toLowerCase().includes(q) || 
                        site.domain.toLowerCase().includes(q) ||
                        site.categoryLabel.toLowerCase().includes(q);
                    return matchCat && matchText;
                });

                if (filtered.length === 0) {
                    sitesGrid.innerHTML = '';
                    emptyState.classList.remove('hidden');
                    return;
                }

                emptyState.classList.add('hidden');
                sitesGrid.innerHTML = filtered.map((site, idx) => {
                    const isFirst = idx === 0;
                    const isLast = idx === filtered.length - 1;
                    // 排序模式下链接不带 href：既不会误跳转，也不会抢走卡片的拖拽
                    const linkAttrs = isSortMode ? 'draggable="false"' : `href="${escapeHtml(site.url)}" target="_blank" rel="noopener noreferrer"`;
                    const name = escapeHtml(site.name);
                    const desc = escapeHtml(site.desc);
                    const domain = escapeHtml(site.domain);
                    const label = escapeHtml(site.categoryLabel);

                    return `
                    <div 
                        data-id="${site.id}"
                        draggable="${isSortMode}"
                        ondragstart="handleDragStart(event, '${site.id}')"
                        ondragover="handleDragOver(event)"
                        ondrop="handleDrop(event, '${site.id}')"
                        ondragend="handleDragEnd(event)"
                        class="site-card group relative bg-white dark:bg-darkCard rounded-2xl border ${isSortMode ? 'border-dashed border-indigo-400 dark:border-indigo-500/70 cursor-move' : 'border-slate-200/80 dark:border-darkBorder hover:-translate-y-1'} p-3.5 sm:p-5 shadow-sm hover:shadow-xl transition-all duration-300 flex flex-col justify-between overflow-hidden select-none">
                        
                        <!-- 顶部悬停彩条 -->
                        <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r ${site.accent} ${isSortMode ? 'opacity-100' : 'opacity-0 group-hover:opacity-100'} transition-opacity duration-300"></div>
                        
                        <div>
                            <!-- 头部：图标 + 右上角操作区 -->
                            <div class="flex items-start justify-between gap-2 mb-3 sm:mb-4">
                                <a ${linkAttrs} class="w-10 h-10 sm:w-12 sm:h-12 rounded-xl ${site.iconBg} flex items-center justify-center shrink-0 group-hover:scale-105 transition-transform duration-200">
                                    ${site.svg}
                                </a>
                                
                                ${isSortMode ? `
                                <!-- 排序控制按钮 (iPhone 单手点按极度友好) -->
                                <div class="flex items-center gap-1 bg-slate-100 dark:bg-slate-800 p-1 rounded-xl">
                                    <button onclick="moveSite('${site.id}', -1)" ${isFirst ? 'disabled' : ''} title="向前移动" class="p-1.5 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-white dark:hover:bg-slate-700 disabled:opacity-30 transition">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                                    </button>
                                    <button onclick="moveSite('${site.id}', 1)" ${isLast ? 'disabled' : ''} title="向后移动" class="p-1.5 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-white dark:hover:bg-slate-700 disabled:opacity-30 transition">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                                    </button>
                                </div>
                                ` : `
                                <div class="flex items-center gap-1">
                                    <span class="hidden sm:inline-block px-2 py-0.5 rounded-lg text-[11px] font-medium bg-slate-100 dark:bg-slate-800/80 text-slate-500 dark:text-slate-400">
                                        ${label}
                                    </span>
                                    <button onclick="copyUrl('${site.id}')" title="复制网址" class="p-1.5 sm:p-2 rounded-lg text-slate-400 hover:text-indigo-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                                    </button>
                                </div>
                                `}
                            </div>

                            <!-- 标题与描述 -->
                            <a ${linkAttrs} class="block focus:outline-none">
                                <div class="flex items-center gap-1">
                                    <h2 class="text-sm sm:text-lg font-bold text-slate-800 dark:text-slate-100 group-hover:text-indigo-500 dark:group-hover:text-indigo-400 transition-colors truncate">
                                        ${name}
                                    </h2>
                                    <svg class="hidden sm:block w-4 h-4 text-slate-400 opacity-0 -translate-x-1 group-hover:opacity-100 group-hover:translate-x-0 transition-all duration-200 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                                    </svg>
                                </div>
                                <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-1 line-clamp-2 leading-relaxed">
                                    ${desc}
                                </p>
                            </a>
                        </div>

                        <!-- 底部：域名 (排序模式下显示删除按钮) -->
                        ${isSortMode ? `
                        <div class="mt-3 sm:mt-4 pt-2.5 sm:pt-3 border-t border-slate-100 dark:border-slate-800/80 flex items-center justify-between gap-2 text-[11px] sm:text-xs text-slate-400 dark:text-slate-500">
                            <span class="truncate font-mono">${domain}</span>
                            <button onclick="deleteSite('${site.id}')" title="删除" class="shrink-0 inline-flex items-center gap-0.5 px-2 py-1 -my-1 -mr-1 rounded-lg text-rose-500 hover:bg-rose-500/10 font-medium transition">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                                删除
                            </button>
                        </div>
                        ` : `
                        <a ${linkAttrs} class="mt-3 sm:mt-4 pt-2.5 sm:pt-3 border-t border-slate-100 dark:border-slate-800/80 flex items-center justify-between text-[11px] sm:text-xs text-slate-400 dark:text-slate-500 group-hover:text-slate-600 dark:group-hover:text-slate-300 transition-colors">
                            <span class="truncate font-mono">${domain}</span>
                            <span class="hidden sm:inline font-medium text-indigo-500 opacity-0 group-hover:opacity-100 transition-opacity shrink-0 ml-1">访问 &rarr;</span>
                        </a>
                        `}
                    </div>
                `}).join('');
            } catch (err) {
                console.error('渲染卡片时出错:', err);
            }
        }

        /**
         * HTML5 拖拽排序事件处理
         */
        function handleDragStart(e, id) {
            if (!isSortMode) return;
            draggedId = id;
            e.dataTransfer.effectAllowed = 'move';
            // Firefox 必须调用 setData 才会开始拖拽
            e.dataTransfer.setData('text/plain', id);
            e.currentTarget.classList.add('opacity-50', 'scale-95');
        }

        function handleDragOver(e) {
            if (!isSortMode) return;
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        }

        function handleDrop(e, targetId) {
            if (!isSortMode) return;
            e.preventDefault();
            if (!draggedId || draggedId === targetId) return;

            const fromIdx = sitesList.findIndex(s => s.id === draggedId);
            const toIdx = sitesList.findIndex(s => s.id === targetId);
            if (fromIdx !== -1 && toIdx !== -1) {
                const [movedItem] = sitesList.splice(fromIdx, 1);
                sitesList.splice(toIdx, 0, movedItem);
                saveOrder();
                renderCards();
            }
        }

        function handleDragEnd(e) {
            e.currentTarget.classList.remove('opacity-50', 'scale-95');
            draggedId = null;
        }

        /**
         * 复制网址到剪贴板并显示 Toast 提示
         */
        function copyUrl(id) {
            const site = sitesList.find(s => s.id === id);
            if (!site) return;
            const url = site.url;
            const ok = () => showToast(`已复制 ${site.name} 的网址`);
            // 优先使用现代剪贴板 API（https / localhost 下可用）
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(url).then(ok).catch(() => legacyCopy(url) ? ok() : showToast('复制失败，请手动复制'));
                return;
            }
            legacyCopy(url) ? ok() : showToast('复制失败，请手动复制');
        }

        // 兼容旧环境（如 file:// 打开）的复制方式，已针对 iOS Safari 处理
        function legacyCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.setAttribute('readonly', '');
            // 16px 防止 iOS 聚焦缩放；fixed 定位防止页面跳动
            ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px;';
            document.body.appendChild(ta);
            let success = false;
            try {
                ta.focus();
                ta.select();
                ta.setSelectionRange(0, text.length); // iOS 上 select() 不一定生效
                success = document.execCommand('copy');
            } catch (e) {
                success = false;
            }
            document.body.removeChild(ta);
            window.getSelection && window.getSelection().removeAllRanges();
            return success;
        }

        /**
         * 显示底部通知气泡
         */
        let toastTimer = null;
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.textContent = message;
            
            toast.classList.remove('translate-y-20', 'opacity-0');
            
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        /**
         * 执行搜索或跳转逻辑
         */
        function handleSearchAction() {
            if (isSortMode) return;
            const engine = searchEngine.value;
            const query = searchInput.value.trim();

            if (engine === 'filter') {
                searchQuery = query;
                renderCards();
                return;
            }

            if (!query) {
                searchInput.focus();
                return;
            }

            let targetUrl = '';
            const encoded = encodeURIComponent(query);
            if (engine === 'google') {
                targetUrl = `https://www.google.com/search?q=${encoded}`;
            } else if (engine === 'baidu') {
                targetUrl = `https://www.baidu.com/s?wd=${encoded}`;
            } else if (engine === 'github') {
                targetUrl = `https://github.com/search?q=${encoded}`;
            }

            if (targetUrl) {
                window.open(targetUrl, '_blank', 'noopener,noreferrer');
            }
        }

        /**
         * 更新分类标签高亮样式
         */
        function updateCategoryButtonsUI(activeCat) {
            categoryBtns.forEach(b => {
                if (b.dataset.category === activeCat) {
                    b.classList.remove('bg-white', 'dark:bg-darkCard', 'text-slate-600', 'dark:text-slate-300', 'border', 'border-slate-200', 'dark:border-darkBorder');
                    b.classList.add('bg-indigo-600', 'text-white', 'shadow-sm');
                } else {
                    b.classList.remove('bg-indigo-600', 'text-white', 'shadow-sm');
                    b.classList.add('bg-white', 'dark:bg-darkCard', 'text-slate-600', 'dark:text-slate-300', 'border', 'border-slate-200', 'dark:border-darkBorder');
                }
            });
        }

        /**
         * 更新实时时间与动态问候语
         */
        function updateClock() {
            const now = new Date();
            const hours = now.getHours();
            let greetingText = '你好，祝你今天愉快';
            if (hours < 6) greetingText = '夜深了，注意休息';
            else if (hours < 12) greetingText = '早上好，开启高效的一天';
            else if (hours < 14) greetingText = '中午好，记得适当小憩';
            else if (hours < 18) greetingText = '下午好，继续保持专注';
            else greetingText = '晚上好，享受属于你的时间';

            document.getElementById('greeting').textContent = greetingText;

            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long', hour: '2-digit', minute: '2-digit', second: '2-digit' };
            document.getElementById('datetime').textContent = now.toLocaleDateString('zh-CN', options);
        }

        /**
         * 初始化事件监听
         */
        function init() {
            // 自动统计网站总数
            updateAllCount();

            // 添加网站弹窗
            addSiteBtn.addEventListener('click', openAddModal);
            addForm.addEventListener('submit', submitAddSite);
            document.getElementById('addCloseBtn').addEventListener('click', closeAddModal);
            document.getElementById('addCancelBtn').addEventListener('click', closeAddModal);
            document.getElementById('addModalBackdrop').addEventListener('click', closeAddModal);
            [addName, addUrl].forEach(el => el.addEventListener('input', () => showAddError('')));

            renderCards();
            updateClock();
            setInterval(updateClock, 1000);

            // 排序按钮监听
            sortToggleBtn.addEventListener('click', toggleSortMode);
            resetOrderBtn.addEventListener('click', resetSiteOrder);

            // 输入框实时响应
            searchInput.addEventListener('input', (e) => {
                const val = e.target.value;
                clearSearch.classList.toggle('hidden', val.length === 0);
                if (searchEngine.value === 'filter') {
                    searchQuery = val;
                    renderCards();
                }
            });

            // 回车触发搜索
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    handleSearchAction();
                }
            });

            // 点击搜索按钮
            searchBtn.addEventListener('click', handleSearchAction);

            // 切换搜索引擎时的交互优化
            searchEngine.addEventListener('change', () => {
                if (searchEngine.value === 'filter') {
                    searchInput.placeholder = '输入关键词筛选网站...';
                    searchQuery = searchInput.value;
                } else {
                    const engineName = searchEngine.options[searchEngine.selectedIndex].text;
                    searchInput.placeholder = `在 ${engineName} 中输入内容并按回车...`;
                    searchQuery = '';
                }
                renderCards();
                searchInput.focus();
            });

            // 清除输入按钮
            clearSearch.addEventListener('click', () => {
                searchInput.value = '';
                searchQuery = '';
                clearSearch.classList.add('hidden');
                renderCards();
                searchInput.focus();
            });

            // 分类筛选按钮
            categoryBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    if (isSortMode) {
                        toggleSortMode();
                    }
                    currentCategory = btn.dataset.category;
                    updateCategoryButtonsUI(currentCategory);
                    renderCards();
                });
            });

            // 深色/浅色主题切换
            themeToggle.addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
                const isDark = document.documentElement.classList.contains('dark');
                try { localStorage.setItem('theme', isDark ? 'dark' : 'light'); } catch (e) {}
            });

            // 全局快捷键 '/' 聚焦搜索框
            document.addEventListener('keydown', (e) => {
                // Esc 关闭弹窗
                if (e.key === 'Escape' && !addModal.classList.contains('hidden')) {
                    closeAddModal();
                    return;
                }
                // 在任何输入框里打字时不拦截 '/'
                const t = e.target;
                const typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
                if (e.key === '/' && !typing && !searchInput.disabled && addModal.classList.contains('hidden')) {
                    e.preventDefault();
                    searchInput.focus();
                }
            });
        }

        // 页面加载完成后启动
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
